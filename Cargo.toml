[package]
name = "bonjour"
version = "0.1.0"
build = "build.rs"
edition = "2024"
authors = ["Quentin Richert <noreply@richert.co>"]
description = "Extract first names with confidence scores."
license = "0BSD"
repository = "https://github.com/qrichert/bonjour.git"
readme = "README.md"
keywords = ["first-name", "name-extraction", "person-name", "nlp", "classification"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["data/name-v1/files/"]

[package.metadata.docs.rs]
all-features = false

[features]
default = []
standalone = []
benchmark-internals = []

[[example]]
name = "standalone"
required-features = ["standalone"]

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[dependencies]
bincode = "1.3.3"
boomphf = { version = "0.6.0", features = ["serde"] }
# Serialization and deserialization of data structures.
serde = { version = "1.0.229", features = ["derive"] }
# Serialize/deserialize JSON.
serde_json = "1.0.151"
sha2 = "0.10.9"
unicode-general-category = "1.1.0"
# Normalize inputs (e.g., remove accents).
unicode-normalization = "0.1.25"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[dev-dependencies]
proptest = "1.7.0"
tempfile = "3.27.0"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
