[package]
name = "name-eval"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "name-eval"

[dependencies]
bincode = "1.3.3"
bonjour = { version = "0.1.0", path = "../..", features = ["benchmark-internals"] }
boomphf = { version = "0.6.0", features = ["serde"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
unicode-casefold = "0.2.0"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"
unicode-script = "0.5.8"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[dev-dependencies]
proptest = "1.7.0"
