[package]
name = "name-eval"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "name-eval"

[dependencies]
bincode = "1.3.3"
boomphf = { version = "0.6.0", features = ["serde"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[dev-dependencies]
proptest = "1.7.0"
