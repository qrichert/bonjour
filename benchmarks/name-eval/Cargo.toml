[package]
name = "name-eval"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "name-eval"

[dependencies]
bonjour = { version = "0.1.0", path = "../..", features = ["benchmark-internals"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"

[dev-dependencies]
proptest = "1.7.0"
