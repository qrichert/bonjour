[package]
name = "pyjour-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
bonjour = { version = "0.1.0", path = "../..", features = ["standalone"] }
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
